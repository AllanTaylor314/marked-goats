name: reusable-build
on:
  workflow_call:
    inputs:
      release:
        description: "Whether this is a release build"
        type: boolean
        default: false
    outputs:
      artifact-name:
        description: "Name of the uploaded build artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}

    env:
      MOD_IS_RELEASE: ${{ inputs.release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'microsoft'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: |
          ACTIVE_VERSION=$(cat .sc_active_version)
          # The subproject matching .sc_active_version always fails to compile
          # here: Stonecutter compiles from raw src/main/java (still in its
          # unsubstituted //? if template form) instead of the per-version
          # generated copy specifically when the active-version file matches
          # the subproject being built. --continue lets every OTHER subproject
          # still build and collect normally despite that one failure.
          ./gradlew buildAndCollect --no-daemon --continue || true
          # Rebuild just the affected subproject with a temporarily different
          # active version to sidestep the collision, then restore the
          # committed value.
          SWAP_VERSION="26.2-fabric"
          if [ "$ACTIVE_VERSION" = "$SWAP_VERSION" ]; then
            SWAP_VERSION="1.19.2-fabric"
          fi
          echo -n "$SWAP_VERSION" > .sc_active_version
          ./gradlew ":$ACTIVE_VERSION:buildAndCollect" --no-daemon
          echo -n "$ACTIVE_VERSION" > .sc_active_version

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/
